<style>
:root{--bg:#e6eaf0;--fr:#fff;--bd:#c5ccd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head>
<body><div id="fr"><canvas id="c" width="480" height="520"></canvas></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=520,GY=470;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=v=>Math.min(W-10,Math.max(10,v)),ri=n=>Math.random()*n|0,pick=a=>a[ri(a.length)];
function fit(){const cs=getComputedStyle(document.documentElement),h=innerHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-36,s=Math.min((innerWidth-36)/W,h/H),d=window.devicePixelRatio||1;c.style.width=W*s+'px';c.style.height=H*s+'px';c.width=Math.round(W*s*d);c.height=Math.round(H*s*d)}
addEventListener('resize',fit);fit();
/* ---- 見た目の定義 ---- */
const HC=[['白','#eee'],['灰色','#9a9a9a'],['茶色','#5a3a1a'],['金色','#e0b030'],['黒','#222'],['赤','#c33']],
CC=[['茶色','#7a4a22'],['紺','#24365e'],['からし色','#c9a227'],['えんじ','#8c2f3f'],['水色','#5b9bd5'],['灰色','#6d7378']],
VC=[['白','#fff'],['赤','#d33'],['黄','#f1c40f'],['水色','#4ac']],HT=['帽子なし','黒いシルクハット','白いシルクハット','青いキャップ','赤いキャップ','黄色いキャップ','白いキャップ','黒いキャップ'],CP=['#2f6fd0','#d33','#f1c40f','#f4f4f4','#222'],
LJ={hair:'#4a2a10',coat:'#b3202a',cap:'#2a5a2a',beard:1};
const LV=[];for(let r=0;r<4;r++)for(let i=0;i<16;i++)LV.push({x:i*32-6+rnd(-10,10),y:8+r*30+rnd(-6,6),r:rnd(34,46),c:`hsl(${rnd(100,135)} 55% ${rnd(26,40)}%)`,oy:0,p:rnd(0,6.28)});
for(let i=0;i<10;i++)LV.push({x:rnd(385,465),y:rnd(55,125),r:rnd(28,38),c:`hsl(${rnd(100,135)} 55% ${rnd(26,38)}%)`,oy:0,k:1,p:rnd(0,6.28)});
const LVc=LV.filter(l=>l.k),LVo=LV.filter(l=>!l.k);
/* ---- 状態 ---- */
let NW,NT,ND=[],scr='title',ov='',overT=0,aim=240,rx=0,ay=0,apples=0,score=0,angry=0,fever=0,newts=0,Wk=[],F=[],bub=[],P=[],Gh=[],Tb=[],Fl=[],WS=[],spT=0,fx=0,shake=0,lvl=0,t=0,gt=0,stage=0,wind=0,tc=0,ljT=0,nT=0,fall=0,fa=0,burst=0,flash=0,pr=null,snd=true,touch=matchMedia('(pointer:coarse)').matches,last=performance.now();
for(let i=0;i<16;i++)WS.push({x:rnd(0,W),y:rnd(140,450),l:rnd(18,40)});
const toT=(q,n)=>({n,hair:HC[q.h][1],long:q.l,coat:CC[q.c][1],crav:VC[q.v][1],hat:q.t==1?'#222':q.t==2?'#f4f4f4':0,cap:q.t>=3?CP[q.t-3]:0});
function newN(){NW={h:ri(6),l:ri(2),c:ri(6),v:ri(4),t:ri(8)};NT=toT(NW,1);
ND=[`${NW.l?'長い':'短い'}${HC[NW.h][0]}の${NW.l?'カツラ':'髪'}`,`${CC[NW.c][0]}のコート`,`${VC[NW.v][0]}の襟`,HT[NW.t]]}
function decoy(){const T={...NW},p1=Math.min(.92,.3+.14*Math.min(stage,8)),r=Math.random(),k=r<p1?1:r<p1+(1-p1)*.65?2:3,N={h:6,l:2,c:6,v:4,t:8};
if(Math.random()<Math.max(0,.6-.15*stage)){const q={};for(const key in N)q[key]=ri(N[key]);if(Object.keys(N).some(key=>q[key]!=NW[key]))return toT(q,0)}
for(const key of Object.keys(N).sort(()=>Math.random()-.5).slice(0,k)){let v;do{v=ri(N[key])}while(v==T[key]);T[key]=v}return toT(T,0)}
newN();
/* ---- 効果音 ---- */
let ac;const AC=()=>{if(!snd)return null;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}catch(e){}return ac};
function tn(f,d,o={}){const a=AC();if(!a)return;const s=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();os.type=o.ty||'sine';os.frequency.setValueAtTime(f,s);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(o.v||.1,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);let n=os;if(o.lp){const q=a.createBiquadFilter();q.frequency.value=o.lp;os.connect(q);n=q}n.connect(g);g.connect(a.destination);os.start(s);os.stop(s+d+.05)}
function nz(d,o={}){const a=AC();if(!a)return;const s=a.currentTime+(o.at||0),b=a.createBuffer(1,a.sampleRate*d|0,a.sampleRate),k=b.getChannelData(0);for(let i=0;i<k.length;i++)k[i]=Math.random()*2-1;const sr=a.createBufferSource(),q=a.createBiquadFilter(),g=a.createGain();sr.buffer=b;q.type=o.ty||'bandpass';q.frequency.setValueAtTime(o.f||1000,s);if(o.to)q.frequency.exponentialRampToValueAtTime(o.to,s+d);if(o.sw){g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(o.v||.1,s+d*.4)}else g.gain.setValueAtTime(o.v||.1,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);sr.connect(q);q.connect(g);g.connect(a.destination);sr.start(s)}
const aah=(v=.04,at=0)=>[250,310,370,440].forEach((f,i)=>tn(f*(1+rnd(-.04,.04)),.95,{ty:'sawtooth',to:f*.68,v,lp:950,at:at+i*.05}));
const SF={click:()=>tn(700,.05,{ty:'square',v:.03}),
step:()=>{nz(.07,{ty:'lowpass',f:320,to:130,v:.06});tn(95,.09,{to:60,v:.05})},
drop:()=>{nz(.18,{f:2200,to:300,v:.05});tn(600,.1,{to:300,v:.05})},
splat:()=>{nz(.15,{ty:'lowpass',f:700,to:120,v:.12});tn(120,.12,{to:60,v:.1})},
newton:()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tn(f,.35,{ty:'triangle',v:.08,at:i*.07}));nz(.5,{ty:'highpass',f:6000,v:.04})},
wrong:()=>{aah(.04);tn(180,.25,{ty:'square',to:120,v:.05})},
fever:()=>{[392,523,659,784,1047].forEach((f,i)=>tn(f,.25,{ty:'sawtooth',lp:2400,v:.05,at:i*.08}));[523,659,784].forEach(f=>tn(f,1,{ty:'triangle',v:.05,at:.4}))},
feverEnd:()=>{[784,659,523,392].forEach((f,i)=>tn(f,.3,{ty:'triangle',v:.06,at:i*.1}))},
lj:()=>{tn(110,.6,{ty:'sawtooth',to:90,lp:500,v:.1});tn(165,.6,{ty:'sawtooth',lp:500,v:.06})},
chop:()=>{nz(.07,{f:1500,v:.14});tn(200,.08,{ty:'square',to:80,v:.06})},
beat:()=>{tn(330,.1,{ty:'square',v:.07});tn(494,.1,{at:.08,ty:'square',v:.07});tn(659,.3,{at:.16,ty:'square',v:.07});nz(.2,{f:3000,v:.05,at:.16})},
up:()=>{[440,554,659,880].forEach((f,i)=>tn(f,.18,{ty:'triangle',v:.07,at:i*.06}))},
crash:()=>{nz(1.2,{ty:'lowpass',f:900,to:80,v:.25});tn(70,1,{ty:'sawtooth',to:35,v:.15,lp:300})},
creak:()=>{tn(120,1.2,{ty:'sawtooth',to:70,lp:400,v:.08});nz(1.2,{f:400,to:200,v:.04})},
over:()=>{[392,370,349,330].forEach((f,i)=>tn(f,.4,{ty:'sawtooth',lp:900,v:.07,at:i*.3}));aah(.05,1.2)},
angry:()=>tn(200,.2,{ty:'sawtooth',to:150,lp:600,v:.06})};
const sf=k=>{try{SF[k]()}catch(e){}};
/* ---- ゲーム進行 ---- */
function say(px,py,tx,col,big){bub.push({x:px,y:py,t:tx,col,l:1,z:big?20:15})}
function start(keep){if(!keep)newN();apples=10;score=0;angry=0;fever=0;newts=0;lvl=0;Wk=[];F=[];bub=[];P=[];Gh=[];Tb=[];Fl=[];ljT=10;nT=0;spT=0;gt=0;stage=0;wind=0;tc=0;fall=0;fa=0;burst=0;LVo.forEach(l=>l.oy=0);scr='play'}
function endg(msg){if(scr!='play'&&scr!='fall')return;fever=0;scr='over';ov=msg;overT=performance.now();sf('over')}
function vapor(w,gh){w.gone=1;if(gh)Gh.push({x:w.x,y:GY-50,l:1});else Tb.push({x:w.x,l:8});for(let i=0;i<8;i++)P.push({x:w.x+rnd(-10,10),y:GY-rnd(10,70),vx:rnd(-30,30),vy:rnd(-60,-20),l:1,h:260,c:gh?'#fff':null})}
function bloom(ax){if(Fl.length>70)return;const bl=[],fl=[];for(let i=0;i<4;i++)bl.push({dx:rnd(-12,12),h:rnd(8,17),bend:rnd(-7,7),c:`hsl(${rnd(95,135)} 55% ${rnd(30,44)}%)`});for(let i=0,n=1+ri(2);i<n;i++)fl.push({dx:rnd(-9,9),h:rnd(15,26),bend:rnd(-5,5),hue:pick([0,35,55,200,285,330])});Fl.push({x:ax,l:10,bl,fl})}
function flora(f){const k=Math.min(1,(10-f.l)/.6),a=Math.min(1,f.l/1.5);x.globalAlpha=a;x.lineCap='round';x.lineWidth=2;
for(const b of f.bl){x.strokeStyle=b.c;x.beginPath();x.moveTo(f.x+b.dx,GY);x.quadraticCurveTo(f.x+b.dx+b.bend*k,GY-b.h*k*.6,f.x+b.dx+b.bend*1.6*k,GY-b.h*k);x.stroke()}
for(const e of f.fl){const tx=f.x+e.dx+e.bend*k,ty=GY-e.h*k;x.strokeStyle='#3d8a3a';x.beginPath();x.moveTo(f.x+e.dx,GY);x.quadraticCurveTo(f.x+e.dx+e.bend*.4*k,GY-e.h*k*.5,tx,ty);x.stroke();x.fillStyle=`hsl(${e.hue} 85% 60%)`;x.beginPath();x.arc(tx,ty,4*k,0,7);x.fill();x.fillStyle='#fff3a0';x.beginPath();x.arc(tx,ty,1.6*k,0,7);x.fill()}
x.globalAlpha=1}
function splash(ax,gd){for(let i=0;i<7;i++)P.push({x:ax,y:GY-2,vx:rnd(-70,70),vy:rnd(-120,-40),g:320,l:.7,h:rnd(0,40),c:gd?pick(['#f2b705','#ffd43b','#ffe066']):null})}
function stageUp(){stage++;sf('up')}
const sa=()=>stage>=2?Math.min(1,(stage-1)*.3):0,sway=()=>Math.sin(t*1.6)*sa(),swv=()=>Math.cos(t*1.6)*1.6*sa()*22;
function hit(w,a){const f=fever>0,gh=!!(a&&a.g);w.hit=1;
if(w.lj){vapor(w,gh);score+=50;say(w.x,GY-95,'+50','#2b8a3e',1);sf('beat')}
else if(w.t.n){newts++;lvl++;stage++;score+=100;fever=6;fx=0;w.rb=1;w.sp*=2.2;Wk.forEach(o=>{if(o.t.n&&!o.hit)o.sp*=2.5});say(w.x,GY-95,'+100','#b8860b',1);shake=10;sf('newton');sf('fever')}
else{vapor(w,gh);if(f){score+=10;say(w.x,GY-95,'+10','#7048e8',0);sf('angry')}else{const a=!!w.an;score-=a?30:50;if(!a)angry++;say(w.x,GY-95,a?'-30':'-50','#d6336c',1);shake=6;sf(a?'angry':'wrong');if(angry>=3)endg('ミスが3回になった')}}}
function fx2(d){for(const p of P){p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=(p.g||0)*d;if(p.g&&p.y>GY-2){p.y=GY-2;p.vy=0;p.vx*=.8}p.l-=d*(p.dec||.9)}P=P.filter(p=>p.l>0);for(const g of Gh){g.y-=38*d;g.l-=d*.5}Gh=Gh.filter(g=>g.l>0);for(const b of Tb)b.l-=d;Tb=Tb.filter(b=>b.l>0);for(const f of Fl)f.l-=d;Fl=Fl.filter(f=>f.l>0);for(const s of WS){s.x+=wind*220*d;if(s.x>W+40)s.x=-40;if(s.x<-40)s.x=W+40}}
function startFall(){scr='fall';fall=0;burst=0;sf('creak');LVo.forEach(l=>{l.dl=rnd(.1,1);l.v=0;l.oy=0;l.ty=GY-l.r*.75-rnd(0,6)});for(let i=0;i<Math.min(10,apples);i++)P.push({x:40+i*44,y:100+(i%2)*14,vx:rnd(-30,30),vy:0,g:600,l:2.4,dec:1,c:'#e03131',r:8})}
function fl(d){fall+=d;const u=Math.min(1,fall/1.5);fa=1.5708*Math.pow(u,2.2);if(fall>1.5){const b=fall-1.5;fa=1.5708-Math.exp(-b*6)*Math.abs(Math.sin(b*14))*.07}
for(const w of Wk){const dist=402-w.x;if(!w.gone&&dist>0&&dist<380&&fa>.3&&dist/Math.tan(fa)-21/Math.sin(fa)<92)vapor(w)}Wk=Wk.filter(w=>!w.gone);
for(const l of LVo)if(fall>l.dl){l.v+=700*d;l.oy+=l.v*d;if(l.y+l.oy>=l.ty){l.oy=l.ty-l.y;l.v=0}}
if(fall>1.5&&!burst){burst=1;shake=14;sf('crash');for(let i=0;i<18;i++)P.push({x:rnd(20,400),y:GY-4,vx:rnd(-40,40),vy:rnd(-80,-20),g:60,l:1.2,dec:1,c:'#d8c8a8',r:rnd(5,10)})}
fx2(d);if(fall>3.3)endg('木こりに木を切り倒された')}
function upd(d){const f=fever>0;gt+=d;
const hasN=Wk.some(w=>w.t.n);nT=(hasN||f)?0:nT+d;
spT-=d;if(spT<=0){if(Wk.length<(f?20:Math.min(12,8+stage))){const l=Math.random()<.5,nw=!f&&!hasN&&(nT>10+stage*.8||Math.random()<Math.max(.07,.14-.01*stage)),an=!nw&&Math.random()<.25;
Wk.push({x:l?-20:W+20,d:l?1:-1,sp:(an?rnd(50,120):rnd(45,95))+lvl*5+stage*4,ph:0,t:nw?toT(NW,1):an?{n:0}:decoy(),an:an?pick(['dog','chicken','cat']):0})}
spT=f?.15:Math.max(.35,rnd(.8,1.7)-lvl*.04-stage*.08)}
const L=Wk.filter(w=>w.lj&&!w.hit);ljT-=d;
if(L.length<(stage>=3?2:1)&&ljT<=0){Wk.push({x:-30,d:1,sp:40+stage*4,ph:0,lj:1,t:LJ});ljT=Math.max(7,rnd(14,20)-stage*1.5);sf('lj')}
let act=0;
for(const w of Wk){const k=1+.3*wind*w.d;
if(w.lj&&!w.hit){if(!w.chop){const lf=!Wk.some(o=>o!==w&&o.lj&&!o.hit&&o.spot=='L');if(w.x>=392&&lf){w.chop=1;w.spot='L'}else if(w.x>=466){w.chop=1;w.spot='R';w.d=-1}else{w.x+=w.sp*d;w.ph+=w.sp*d*.12;w.fs=(w.fs||0)+d;if(w.fs>.5){w.fs=0;sf('step')}}}if(w.chop)act++}
else{w.x+=w.d*w.sp*k*d;w.ph+=w.sp*d*.12}
if(w.rb)for(let i=0;i<2;i++)P.push({x:w.x+rnd(-12,12),y:GY-rnd(10,80),vx:rnd(-20,20),vy:rnd(-40,-10),l:1,h:Math.random()*360})}
Wk=Wk.filter(w=>w.x>-45&&w.x<W+45&&!w.gone);
if(act){const b=tc;tc+=d*act;if((tc*2|0)!==(b*2|0))sf('chop');shake=Math.max(shake,2);if(tc>=6){tc=6;startFall();return}}else tc=Math.max(0,tc-d*.35);
if(f){fever-=d;fx-=d;if(fx<=0){F.push({x:cl(aim+rnd(-70,70)),y:120,v:0,g:1,vx:swv()});fx=.05}
if(fever<=0){fever=0;apples=Math.min(12,apples+4);for(const a of F)for(let i=0;i<3;i++)P.push({x:a.x,y:a.y,vx:rnd(-50,50),vy:rnd(-50,50),l:.6,h:0});F=[];say(240,200,'リンゴ +4','#c92a2a',1);sf('feverEnd')}}
for(const a of F){a.v+=620*d;a.y+=a.v*d;a.x+=(a.vx||0)*d;
if(a.y>GY-92&&a.y<GY-8)for(const w of Wk){if(!w.hit&&!w.gone&&!(f&&w.t.n)&&Math.abs(a.x-w.x)<(touch?24:17)&&a.y>(w.an?GY-46:GY-92)){a.done=1;hit(w,a);break}}
if(a.y>GY&&!a.done){a.done=1;splash(a.x,a.g);bloom(a.x);if(!f)sf('splat')}}
F=F.filter(a=>!a.done);fx2(d);
if(scr=='play'&&apples<=0&&fever<=0&&!F.length)endg('リンゴを使い切った')}
/* ---- 入力 ---- */
const BTN={title:[{id:'play',r:[170,432,140,48],t:'PLAY'},{id:'snd',r:[380,452,84,28],t:()=>snd?'音 ON':'音 OFF'}],over:[{id:'again',r:[170,334,140,40],t:'もう一度'}]};
function act(id){if(id=='play'&&scr=='title')start(1);else if(id=='again'&&scr=='over')start();else if(id=='snd')snd=!snd}
const pm=e=>{const b=c.getBoundingClientRect();rx=(e.clientX-b.left)*W/b.width;aim=cl(rx);ay=(e.clientY-b.top)*H/b.height};
addEventListener('pointermove',pm);
const pd=e=>{pm(e);AC();ambStart();touch=e.pointerType=='touch';
if(scr=='title'||scr=='over'){for(const b of BTN[scr]){const r=b.r;if(rx>=r[0]&&rx<=r[0]+r[2]&&ay>=r[1]&&ay<=r[1]+r[3]){if(scr=='over'&&performance.now()-overT<900)return;pr={id:b.id,t:performance.now()};if(b.id!='snd')sf('click');setTimeout(()=>act(b.id),120);if(b.id=='snd')setTimeout(()=>sf('click'),150);return}}return}
if(scr!='play')return;
if(fever>0){for(let i=0;i<4;i++)F.push({x:cl(aim+rnd(-50,50)),y:120,v:0,g:1,vx:swv()});return}
if(apples>0){apples--;F.push({x:aim,y:120,v:0,vx:swv()});sf('drop')}};
addEventListener('pointerdown',pd);
/* ---- 描画 ---- */
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function apple(px,py,r,gd){x.fillStyle=gd?'#f2b705':'#e03131';x.beginPath();x.arc(px,py,r,0,7);x.fill();x.fillStyle=gd?'#fff2a8':'#ff8787';x.beginPath();x.arc(px-r/3,py-r/3,r/4,0,7);x.fill();x.strokeStyle='#5a3a1a';x.lineWidth=2;x.beginPath();x.moveTo(px,py-r);x.lineTo(px+2,py-r-5);x.stroke();x.fillStyle='#51cf66';x.beginPath();x.ellipse(px+6,py-r-3,5,2.5,-.4,0,7);x.fill()}
function soul(gx,gy){x.fillStyle='#f4f7ff';x.shadowColor='#bcd';x.shadowBlur=12;x.beginPath();x.arc(gx,gy,9,Math.PI,0);x.quadraticCurveTo(gx+10,gy+14,gx+4,gy+22);x.quadraticCurveTo(gx,gy+14,gx-4,gy+22);x.quadraticCurveTo(gx-10,gy+14,gx-9,gy);x.fill();x.shadowBlur=0;x.fillStyle='#456';x.fillRect(gx-5,gy-2,3,4);x.fillRect(gx+2,gy-2,3,4)}
function tomb(bx){x.fillStyle='#5a9a40';x.beginPath();x.ellipse(bx,GY+4,17,5,0,0,7);x.fill();x.fillStyle='#a3a9b0';x.strokeStyle='#6c7278';x.lineWidth=2;x.beginPath();x.moveTo(bx-12,GY+3);x.lineTo(bx-12,GY-20);x.arc(bx,GY-20,12,Math.PI,0);x.lineTo(bx+12,GY+3);x.closePath();x.fill();x.stroke();
